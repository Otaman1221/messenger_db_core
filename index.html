
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8"><title>Sambir Messenger PRO</title>
            <style>
                body { background: #121212; color: #eee; font-family: sans-serif; padding: 20px; margin: 0; }
                #chat { background: #1e1e1e; border-radius: 10px; height: 85vh; overflow-y: auto; padding: 20px; border: 1px solid #333; }
                .msg { margin-bottom: 12px; padding: 10px; border-bottom: 1px solid #222; }
                .u { color: #3498db; font-weight: bold; }
                .t { color: #555; font-size: 0.8em; float: right; }
            </style>
        </head>
        <body>
            <div id="chat">Синхронізація з репозиторієм...</div>
            <script>
                async function load() {
                    const r = await fetch('data.json?v=' + Date.now());
                    const d = await r.json();
                    document.getElementById('chat').innerHTML = d.map(m => `
                        <div class="msg"><span class="t">${m.time}</span><span class="u">${m.user}</span><br>${m.text}</div>
                    `).reverse().join('');
                }
                setInterval(load, 5000); load();
            </script>
        </body>
        </html>
