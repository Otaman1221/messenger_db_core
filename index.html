<!DOCTYPE html>
    <html lang="uk">
    <head><meta charset="UTF-8"><title>Corp Web</title></head>
    <body style="background:#1a1a1a;color:white;font-family:sans-serif;padding:20px;">
        <h2>Corp Messenger Web</h2>
        <div id="auth_block">
            <input type="password" id="pass" placeholder="Вставте ваш токен">
            <button onclick="save()">Увійти</button>
        </div>
        <div id="chat_block" style="display:none;">
            <div id="chat" style="height:400px;overflow-y:auto;background:#222;padding:10px;margin-bottom:10px;border-radius:10px;"></div>
            <input type="text" id="msg" placeholder="Повідомлення" style="width:70%;">
            <button onclick="send()">></button>
        </div>
        <script>
            let t = localStorage.getItem('token');
            if(t) showChat();
            function save(){ t = document.getElementById('pass').value; localStorage.setItem('token', t); showChat(); }
            function showChat(){ document.getElementById('auth_block').style.display='none'; document.getElementById('chat_block').style.display='block'; load(); setInterval(load, 5000); }
            async function load(){
                const res = await fetch(`https://api.github.com/repos/Otaman1221/messenger_db_core/contents/messages?t=${Date.now()}`, 
                    {headers:{"Authorization":`token ${t}`}});
                if(res.ok){
                    const files = await res.json();
                    let h = "";
                    for(let f of files.slice(-15)){
                        if(f.name.endsWith('.json')){
                            const m = await (await fetch(f.download_url)).json();
                            h += `<div><b>${m.nick}:</b> ${m.text}</div>`;
                        }
                    }
                    document.getElementById('chat').innerHTML = h;
                }
            }
            async function send(){
                const txt = document.getElementById('msg').value;
                const ts = Date.now();
                const content = btoa(unescape(encodeURIComponent(JSON.stringify({nick: "WebUser", text: txt, ts: ts}))));
                await fetch(`https://api.github.com/repos/Otaman1221/messenger_db_core/contents/messages/msg_${ts}.json`, {
                    method: "PUT",
                    headers: {"Authorization":`token ${t}`, "Content-Type":"application/json"},
                    body: JSON.stringify({message:"web_msg", content: content})
                });
                document.getElementById('msg').value = '';
                load();
            }
        </script>
    </body></html>
