<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"><title>Corp Web</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #auth { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; width: 280px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #222; padding: 10px; border-radius: 10px; max-width: 80%; align-self: flex-start; border-left: 3px solid #128c7e; }
        .my { align-self: flex-end; background: #054d44; border-left: none; border-right: 3px solid #075e54; }
    </style>
</head>
<body>
    <div id="auth">
        <h3>Вхід у систему</h3>
        <input type="password" id="p" placeholder="Вставте токен (github_pat_...)">
        <button onclick="save()" style="padding:10px 20px; cursor:pointer;">Увійти</button>
    </div>
    <div id="chat_block" style="display:none; flex-direction:column; height:100vh;">
        <div id="chat"></div>
        <div style="padding:15px; background:#1a1a1a; display:flex; gap:10px;">
            <input type="text" id="nick" placeholder="Нік" style="width:70px;">
            <input type="text" id="m" placeholder="Повідомлення..." style="flex:1;">
            <button onclick="send()" style="padding:10px;">></button>
        </div>
    </div>
    <script>
        let t = localStorage.getItem('t_secure');
        if(t) show();

        function save() { 
            t = document.getElementById('p').value; 
            localStorage.setItem('t_secure', t); 
            show(); 
        }

        function show() { 
            document.getElementById('auth').style.display='none'; 
            document.getElementById('chat_block').style.display='flex'; 
            load(); 
            setInterval(load, 4000); 
        }

        async function load() {
            try {
                const res = await fetch(`https://api.github.com/repos/Otaman1221/messenger_db_core/contents/messages?nocache=${Date.now()}`, 
                    { headers: { "Authorization": `token ${t}` } });

                if(res.ok) {
                    const files = await res.json();
                    const jsonFiles = files.filter(f => f.name.endsWith('.json')).sort((a,b) => a.name.localeCompare(b.name));
                    let h = "";
                    for(let f of jsonFiles.slice(-15)) {
                        const mRes = await fetch(f.download_url + "?t=" + Date.now());
                        const m = await mRes.json();
                        const isMy = m.nick === document.getElementById('nick').value;
                        h += `<div class="msg ${isMy ? 'my' : ''}"><b>${m.nick}:</b><br>${m.text}</div>`;
                    }
                    document.getElementById('chat').innerHTML = h || "Повідомлень немає";
                    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
                }
            } catch(e) { 
                console.error(e); 
            }
        }

        async function send() {
            const mi = document.getElementById('m'), ni = document.getElementById('nick');
            if(!mi.value) return;
            const ts = Date.now();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify({nick: ni.value || "Web", text: mi.value, ts: ts}))));
            await fetch(`https://api.github.com/repos/Otaman1221/messenger_db_core/contents/messages/msg_${ts}.json`, {
                method: "PUT", 
                headers: { "Authorization": `token ${t}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "web_msg", content: content })
            });
            mi.value = ''; 
            load();
        }
    </script>
</body></html>
